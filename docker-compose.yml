services:
  mail-sieve:
    build:
      context: .
      dockerfile: Dockerfile
    image: mail-sieve:local
    container_name: mail-sieve
    restart: unless-stopped
    ports:
      - "0.0.0.0:8899:8899"
    environment:
      TZ: "Asia/Shanghai"
      MAIL_SIEVE_DB_PATH: "/app/hotmail_inventory.sqlite3"
      GPTCLI_ROOT_DIR: "/gptcli-2api"
    volumes:
      - ./:/app
      - /www/wwwroot/gptcli-2api:/gptcli-2api
